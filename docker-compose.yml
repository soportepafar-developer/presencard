services:
  php:
    build: ./docker/php
    volumes:
      - ./back-presencard:/var/www/back-presencard
    depends_on:
      - db

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8090:80"
    volumes:
      - ./back-presencard:/var/www/back-presencard:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: presencard
      MYSQL_USER: presencard
      MYSQL_PASSWORD: presencard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3317:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
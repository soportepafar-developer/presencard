# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    #http_method_override: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        # Sesiones en una carpeta propia (var/sessions): el /tmp compartido del hosting se limpia con el valor global
        # de PHP (~24 min) y cerraría la sesión; así dura 8 horas de inactividad y no se pierde al vaciar var/cache.
        handler_id: session.handler.native_file
        save_path: '%kernel.project_dir%/var/sessions'
        gc_maxlifetime: 28800
        cookie_lifetime: 28800
        # Nombre y ruta propios: la app puede convivir en una subcarpeta de un sitio que ya usa PHPSESSID.
        name: presencard_session
        cookie_path: '%env(APP_COOKIE_PATH)%'
        cookie_secure: auto
        cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true
